<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="StringMap structured-score fingering pipeline" />
    <title>StringMap pipeline</title>
  </head>
  <body>
    <main class="shell">
      <header>
        <div>
          <p class="eyebrow">Structured-score milestone</p>
          <h1>MusicXML → playable guitar tab</h1>
        </div>
        <p class="scope">Monophonic · standard tuning · explainable fingering</p>
      </header>

      <section class="controls" aria-label="Pipeline controls">
        <label class="file-button">
          <span>Choose MusicXML</span>
          <input id="musicxml-file" type="file" accept=".xml,.musicxml,application/vnd.recordare.musicxml+xml" />
        </label>
        <label>
          Profile
          <select id="profile">
            <option value="beginner">Beginner</option>
            <option value="balanced" selected>Balanced</option>
            <option value="stayInPosition">Stay in Position</option>
          </select>
        </label>
        <button id="run" type="button">Run pipeline</button>
        <span id="status" role="status">Ready</span>
      </section>

      <section class="player-panel">
        <div class="transport">
          <button id="play" type="button" disabled>Play / pause</button>
          <button id="stop" type="button" disabled>Stop</button>
          <span id="score-summary"></span>
        </div>
        <div class="notation-viewport">
          <div id="alpha-tab" aria-label="Generated notation and tablature"></div>
        </div>
      </section>

      <section class="inspection">
        <div class="inspection-heading">
          <div>
            <p class="eyebrow">Optimization trace</p>
            <h2>Why each position won</h2>
          </div>
          <p id="total-cost"></p>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Note</th>
                <th>Candidates</th>
                <th>Chosen</th>
                <th>Fret move</th>
                <th>Position</th>
                <th>String</th>
                <th>Stretch</th>
                <th>Height</th>
                <th>Open</th>
                <th>Total</th>
              </tr>
            </thead>
            <tbody id="trace"></tbody>
          </table>
        </div>
        <details>
          <summary>Generated alphaTex</summary>
          <pre id="alphatex"></pre>
        </details>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
