<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    :root {
      --paper: #FFFDF7;
      --cursor-bar: rgba(91, 71, 189, 0.10);
      --cursor-beat: rgba(91, 71, 189, 0.30);
      color-scheme: light;
    }
    html, body { margin: 0; min-height: 100%; background: var(--paper); }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; overflow-x: hidden; }
    #score { min-height: 100%; padding: 20px 4px 24px; box-sizing: border-box; }
    .at-highlight * { fill: #C43A25 !important; stroke: #C43A25 !important; }
    .at-cursor-bar { background: var(--cursor-bar) !important; }
    .at-cursor-beat { background: var(--cursor-beat) !important; }
  </style>
  <script src="alphaTab.min.js"></script>
</head>
<body>
  <main id="score" aria-label="Guitar notation and tablature"></main>
  <script src="source-note-map.js"></script>
  <script src="bridge.js"></script>
</body>
</html>
