<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>StringMap promo</title>
<link rel="stylesheet" href="fonts/local.css">
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
"use strict";
const VERTICAL = new URLSearchParams(location.search).has("vertical");
const W = VERTICAL ? 1080 : 1920, H = VERTICAL ? 1920 : 1080;
const BPM = 132, Q = 60 / BPM, BAR = 3 * Q, T0 = 0.5;   // music starts at 0.5 s
const DURATION = 26;
const bt = k => T0 + (k - 1) * BAR;                  // start of bar k
const cv = document.getElementById("c");
cv.width = W; cv.height = H;
const ctx = cv.getContext("2d");

// ---------- palette (from apps/ios/StringMap/DesignSystem.swift) ----------
const C = {
  tobacco: "#1A1410", tobaccoEdge: "#141009", raisedD: "#241C16", insetD: "#120E0B", hairD: "#3B2E24",
  cream: "#F3EDE0", creamEdge: "#EFE7D6", raisedL: "#FFFCF4", insetL: "#E6DCC8", hairL: "#D5C8B0",
  ink: "#231A13", inkMuted: "#6F604E",
  red: "#C43A25", redD: "#E0765C", blue: "#1B7FA6", blueD: "#5FA8C8",
  green: "#2C8B63", greenD: "#6FC49E", amber: "#B8770F", amberD: "#E3B457",
  plateHi: "#33261D", plateEdge: "#160F0C", board: "#33261E", boardEdge: "#241A15",
  fret: "#CFCCC4", string: "#C9B98F", inlay: "#E8DFCB", bone: "#EDE3CD",
  onPlate: "#A89880", onPlateDim: "#8A7B67", rejected: "#8A7F6E",
};
const OPENS = [64, 59, 55, 50, 45, 40];          // string 1 (high E) .. string 6
const STRING_NAMES = ["E4", "B3", "G3", "D3", "A2", "E2"];
const NOTE_NAMES = ["C", "C♯", "D", "D♯", "E", "F", "F♯", "G", "G♯", "A", "A♯", "B"];
const noteName = m => NOTE_NAMES[m % 12] + (Math.floor(m / 12) - 1);

// ---------- math helpers ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const easeOut = k => 1 - Math.pow(1 - clamp(k), 3);
const easeIn = k => Math.pow(clamp(k), 3);
const easeInOut = k => { k = clamp(k); return k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };
const prog = (t, a, d) => clamp((t - a) / d);
/** 0→1 fade-in at a, 1→0 fade-out ending at b. */
function win(t, a, b, fi = 0.45, fo = 0.4) {
  if (t < a || t > b) return 0;
  return Math.min(easeOut((t - a) / fi), fo > 0 ? easeOut((b - t) / fo) : 1);
}
function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
}

// ---------- data ----------
let D, IMG = {};
const noteT = n => T0 + n.on * Q;
function melodyIndexAt(t) {
  const m = D.melody; if (t < noteT(m[0])) return -1;
  let lo = 0, hi = m.length - 1;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (noteT(m[mid]) <= t) lo = mid; else hi = mid - 1; }
  return lo;
}
function positionsFor(midi, maxFret = 20) {
  const out = [];
  OPENS.forEach((o, i) => { const f = midi - o; if (f >= 0 && f <= maxFret) out.push({ s: i + 1, f }); });
  return out.sort((a, b) => a.f - b.f || a.s - b.s);
}

// ---------- text ----------
const FONTS = { display: "Fraunces", ui: "Inter", mono: "JetBrains Mono" };
function setFont(size, weight = 400, family = "ui") { ctx.font = `${weight} ${size}px "${FONTS[family]}"`; }
function txt(s, x, y, o = {}) {
  ctx.save();
  setFont(o.size || 28, o.weight || 400, o.family || "ui");
  ctx.fillStyle = o.color || C.cream;
  ctx.globalAlpha *= (o.alpha ?? 1);
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.baseline || "alphabetic";
  ctx.letterSpacing = (o.ls || 0) + "px";
  ctx.fillText(s, x, y);
  const w = ctx.measureText(s).width;
  ctx.restore();
  return w;
}
function measure(s, size, weight = 400, family = "ui", ls = 0) {
  ctx.save(); setFont(size, weight, family); ctx.letterSpacing = ls + "px";
  const w = ctx.measureText(s).width; ctx.restore(); return w;
}
function wrapLines(s, maxW, size, weight, family) {
  const words = s.split(" "); const lines = []; let line = "";
  for (const w of words) {
    const test = line ? line + " " + w : w;
    if (measure(test, size, weight, family) > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}
function para(s, x, y, maxW, lh, o = {}) {
  const lines = wrapLines(s, maxW, o.size || 28, o.weight || 400, o.family || "ui");
  lines.forEach((l, i) => txt(l, x, y + i * lh, o));
  return lines.length * lh;
}
/** Rich line: segments [{t, color, weight, family, size, dy}] */
function rich(segs, x, y, o = {}) {
  let total = 0;
  for (const s of segs) total += measure(s.t, s.size || o.size, s.weight || o.weight || 400, s.family || o.family || "ui");
  let cx = o.align === "center" ? x - total / 2 : o.align === "right" ? x - total : x;
  for (const s of segs) {
    cx += txt(s.t, cx, y + (s.dy || 0), { ...o, ...s, align: "left" });
  }
  return total;
}
/** Kicker + headline + body block; each line fades and rises in on its own schedule. */
function textBlock(t, b) {
  const a = win(t, b.a, b.b, 0.5, 0.35);
  if (a <= 0) return;
  const dark = b.dark !== false;
  const rise = k => (1 - easeOut(k)) * 26;
  let y = b.y;
  ctx.save();
  if (b.kicker) {
    const k = prog(t, b.a, 0.5);
    ctx.globalAlpha = a * k;
    txt(b.kicker, b.x, y + rise(k), { size: 21, weight: 600, color: dark ? C.redD : C.red, ls: 3.5, align: b.align });
    y += 58;
  }
  if (b.head) {
    const k = prog(t, b.a + 0.08, 0.55);
    ctx.globalAlpha = a * k;
    const size = b.headSize || 68, lh = size * 1.1;
    const lines = b.head.split("\n").flatMap(l => wrapLines(l, b.w || 700, size, 600, "display"));
    lines.forEach((l, i) => txt(l, b.x, y + size * 0.8 + i * lh + rise(k), { size, weight: 600, family: "display", color: dark ? C.cream : C.ink, align: b.align, ls: -0.5 }));
    y += lines.length * lh + 26;
  }
  if (b.body) {
    const k = prog(t, b.a + 0.22, 0.6);
    ctx.globalAlpha = a * k;
    y += para(b.body, b.x, y + 30 + rise(k), b.bw || b.w || 640, (b.bodySize || 29) * 1.42, { size: b.bodySize || 29, color: dark ? C.onPlate : C.inkMuted, align: b.align });
  }
  ctx.restore();
  return y;
}

// ---------- shapes ----------
function rrect(x, y, w, h, r) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
}
function glowDot(x, y, r, color, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, hexA(color, a)); g.addColorStop(0.45, hexA(color, a * 0.45)); g.addColorStop(1, hexA(color, 0));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
}
function background(dark, t) {
  ctx.fillStyle = dark ? C.tobacco : C.cream; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W * 0.5, H * 0.42, 80, W * 0.5, H * 0.5, W * 0.72);
  if (dark) { g.addColorStop(0, "rgba(90,55,32,0.30)"); g.addColorStop(1, "rgba(8,5,3,0.55)"); }
  else { g.addColorStop(0, "rgba(255,252,244,0.65)"); g.addColorStop(1, "rgba(200,180,150,0.28)"); }
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

// ---------- fretboard (mirrors FretboardView.swift Metrics) ----------
function fbMetrics(r) {
  const s = r.scale || 1;
  const m = { ...r };
  m.gutter = 64 * s; m.top = 34 * s; m.bottom = 40 * s; m.pad = 17 * s; m.radius = 26 * s;
  m.left = r.x + m.gutter; m.bw = r.w - m.gutter * 2; m.bh = r.h - m.top - m.bottom;
  m.marker = Math.min(54 * s, m.bh / 4.4);
  const total = r.frets, logW = r.logBlend ?? 0.6;
  m.frac = n => {
    const lin = n / total;
    const lg = (1 - Math.pow(2, -n / 12)) / (1 - Math.pow(2, -total / 12));
    return lin * (1 - logW) + lg * logW;
  };
  m.fretX = n => m.left + m.frac(n) * m.bw;
  m.markerX = f => f <= 0 ? m.left + m.marker * 0.42 : m.left + (m.frac(f - 1) + m.frac(f)) / 2 * m.bw;
  m.stringY = i => r.y + m.top + i * m.bh / 5;
  m.pt = p => ({ x: m.markerX(p.f), y: m.stringY(p.s - 1) });
  return m;
}
function drawFretboard(r) {
  const m = fbMetrics(r);
  const a = r.alpha ?? 1;
  if (a <= 0) return m;
  ctx.save();
  ctx.globalAlpha *= a;
  // plate + shadow
  ctx.save();
  ctx.shadowColor = r.onCream ? "rgba(70,45,25,0.35)" : "rgba(0,0,0,0.55)"; ctx.shadowBlur = 50 * (r.scale || 1); ctx.shadowOffsetY = 18 * (r.scale || 1);
  const pg = ctx.createLinearGradient(r.x, r.y, r.x + r.w * 0.3, r.y + r.h);
  pg.addColorStop(0, C.plateHi); pg.addColorStop(1, C.boardEdge);
  ctx.fillStyle = pg; rrect(r.x, r.y, r.w, r.h, m.radius); ctx.fill();
  ctx.restore();
  ctx.strokeStyle = C.plateEdge; ctx.lineWidth = 1.5; rrect(r.x + .5, r.y + .5, r.w - 1, r.h - 1, m.radius); ctx.stroke();
  ctx.save(); rrect(r.x, r.y, r.w, r.h, m.radius); ctx.clip();
  // board
  const bg = ctx.createLinearGradient(0, r.y + m.top - m.pad, 0, r.y + m.top + m.bh + m.pad);
  bg.addColorStop(0, C.plateHi); bg.addColorStop(0.5, C.board); bg.addColorStop(1, C.plateHi);
  ctx.fillStyle = bg; rrect(m.left, r.y + m.top - m.pad, m.bw, m.bh + m.pad * 2, 4); ctx.fill();
  // subtle wood grain
  ctx.globalAlpha *= 1;
  for (let i = 0; i < 26; i++) {
    const yy = r.y + m.top - m.pad + (i + 0.5) * (m.bh + 2 * m.pad) / 26;
    ctx.strokeStyle = `rgba(0,0,0,${0.05 + 0.04 * Math.sin(i * 2.3)})`; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(m.left, yy); ctx.lineTo(m.left + m.bw, yy + Math.sin(i) * 2); ctx.stroke();
  }
  const fullFrets = Math.ceil(r.frets - 1e-6);
  // inlays
  for (const f of [3, 5, 7, 9, 12, 15, 17, 19]) {
    if (f > fullFrets) continue;
    const cx = m.markerX(f), cy = r.y + m.top + m.bh / 2, rr = 6.5 * (r.scale || 1);
    ctx.fillStyle = hexA(C.inlay, 0.5);
    if (f % 12 === 0) { [-1, 1].forEach(d => { ctx.beginPath(); ctx.arc(cx, cy + d * m.bh * 0.2, rr, 0, 7); ctx.fill(); }); }
    else { ctx.beginPath(); ctx.arc(cx, cy, rr, 0, 7); ctx.fill(); }
  }
  // fret wires
  for (let f = 1; f <= fullFrets; f++) {
    const x = m.fretX(f);
    const wg = ctx.createLinearGradient(0, r.y + m.top - m.pad, 0, r.y + m.top + m.bh + m.pad);
    wg.addColorStop(0, hexA(C.fret, 0.5)); wg.addColorStop(0.5, C.fret); wg.addColorStop(1, hexA(C.fret, 0.5));
    ctx.fillStyle = wg; ctx.fillRect(x - 1.4 * (r.scale || 1), r.y + m.top - m.pad, 2.8 * (r.scale || 1), m.bh + m.pad * 2);
  }
  // strings (string 1 thinnest, on top)
  for (let i = 0; i < 6; i++) {
    const th = (1.2 + i * 0.55) * (r.scale || 1);
    ctx.fillStyle = hexA(C.string, 0.92);
    ctx.fillRect(m.left, m.stringY(i) - th / 2, m.bw, th);
    ctx.fillStyle = "rgba(255,245,220,0.18)";
    ctx.fillRect(m.left, m.stringY(i) - th / 2, m.bw, Math.max(0.6, th * 0.35));
  }
  // nut
  ctx.fillStyle = C.bone; rrect(m.fretX(0) - 4 * (r.scale || 1), r.y + m.top - m.pad - 1, 8 * (r.scale || 1), m.bh + m.pad * 2 + 2, 2); ctx.fill();
  // labels
  for (let i = 0; i < 6; i++) txt(STRING_NAMES[i], r.x + m.gutter / 2, m.stringY(i), { size: 17 * (r.scale || 1), weight: 600, color: C.onPlate, align: "center", baseline: "middle" });
  for (const f of [3, 5, 7, 9, 12, 15, 17, 19]) if (f <= fullFrets) txt(String(f), m.markerX(f), r.y + m.top + m.bh + m.bottom / 2 + 3, { size: 15 * (r.scale || 1), weight: 600, color: C.onPlateDim, align: "center", baseline: "middle" });
  // ghost candidates
  for (const g of r.ghosts || []) {
    const p = m.pt(g); const ga = g.alpha ?? 1;
    ctx.save(); ctx.globalAlpha *= ga;
    ctx.fillStyle = "rgba(20,14,10,0.55)"; ctx.beginPath(); ctx.arc(p.x, p.y, m.marker * 0.46, 0, 7); ctx.fill();
    ctx.strokeStyle = hexA(C.inlay, 0.75); ctx.lineWidth = 2.2; ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.arc(p.x, p.y, m.marker * 0.46, 0, 7); ctx.stroke(); ctx.setLineDash([]);
    txt(String(g.f), p.x, p.y + 1, { size: m.marker * 0.42, weight: 700, color: C.inlay, align: "center", baseline: "middle" });
    ctx.restore();
  }
  // trail
  for (const g of r.trail || []) {
    const p = m.pt(g); ctx.fillStyle = hexA(g.color || C.redD, g.alpha ?? 0.35);
    ctx.beginPath(); ctx.arc(p.x, p.y, m.marker * 0.2, 0, 7); ctx.fill();
  }
  // route line active -> upcoming
  if (r.route && r.route.from && r.route.to) {
    const p1 = m.pt(r.route.from), p2 = m.pt(r.route.to);
    const lg = ctx.createLinearGradient(p1.x, p1.y, p2.x, p2.y);
    lg.addColorStop(0, C.redD); lg.addColorStop(1, C.blueD);
    ctx.save(); ctx.strokeStyle = lg; ctx.lineCap = "round";
    ctx.globalAlpha *= (r.route.alpha ?? 1);
    ctx.shadowColor = C.redD; ctx.shadowBlur = 18; ctx.lineWidth = 6; ctx.globalAlpha *= 0.6;
    ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
    ctx.shadowBlur = 0; ctx.lineWidth = 3; ctx.globalAlpha /= 0.6;
    ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
    ctx.restore();
  }
  // markers
  for (const mk of r.markers || []) {
    const p = m.pt(mk); const active = mk.kind !== "next";
    const tint = mk.color || (active ? C.redD : C.blueD);
    const size = (active ? m.marker : m.marker * 0.82) * (mk.scale ?? 1);
    ctx.save(); ctx.globalAlpha *= (mk.alpha ?? 1);
    glowDot(p.x, p.y, size * 1.15, tint, active ? 0.75 : 0.45);
    ctx.fillStyle = tint; ctx.beginPath(); ctx.arc(p.x, p.y, size / 2, 0, 7); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.6)"; ctx.lineWidth = active ? 2.2 : 1.5; ctx.stroke();
    txt(mk.label ?? String(mk.f), p.x, p.y + 1, { size: size * 0.46, weight: 700, color: "#fff", align: "center", baseline: "middle" });
    ctx.restore();
  }
  ctx.restore();
  ctx.restore();
  return m;
}
/** Live melody state for a route at time t. */
function liveRoute(t, route) {
  const i = melodyIndexAt(t);
  if (i < 0) return { i, markers: [], route: null };
  const cur = route[i], nxt = route[i + 1];
  const markers = [];
  if (nxt && !(nxt.s === cur.s && nxt.f === cur.f)) markers.push({ ...nxt, kind: "next" });
  const k = prog(t, noteT(D.melody[i]), 0.12);
  markers.push({ ...cur, kind: "now", scale: 1 + 0.18 * (1 - k) });
  return { i, markers, route: nxt && !(nxt.s === cur.s && nxt.f === cur.f) ? { from: cur, to: nxt } : null };
}

// ---------- device mockups ----------
function device(img, cx, cy, h, o = {}) {
  if (!img) return;
  const a = o.alpha ?? 1; if (a <= 0) return;
  const ipad = o.ipad;
  const bez = h * (ipad ? 0.028 : 0.021);
  const sh = h - bez * 2, sw = sh * img.width / img.height;
  const w = sw + bez * 2;
  const R = h * (ipad ? 0.045 : 0.078), r = h * (ipad ? 0.03 : 0.064);
  const x = cx - w / 2, y = cy - h / 2;
  ctx.save();
  ctx.globalAlpha *= a;
  if (o.rot) { ctx.translate(cx, cy); ctx.rotate(o.rot); ctx.translate(-cx, -cy); }
  ctx.save();
  ctx.shadowColor = o.dark ? "rgba(0,0,0,0.6)" : "rgba(80,52,30,0.30)"; ctx.shadowBlur = 70; ctx.shadowOffsetY = 34;
  ctx.fillStyle = "#16110D"; rrect(x, y, w, h, R); ctx.fill();
  ctx.restore();
  ctx.strokeStyle = o.dark ? "#4A3B30" : "#5b4a3d"; ctx.lineWidth = 2.5; rrect(x + 1, y + 1, w - 2, h - 2, R); ctx.stroke();
  ctx.save(); rrect(x + bez, y + bez, sw, sh, r); ctx.clip();
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(img, x + bez, y + bez, sw, sh);
  ctx.restore();
  if (!ipad) { ctx.fillStyle = "#0b0908"; rrect(cx - sw * 0.145, y + bez + sh * 0.0125, sw * 0.29, sh * 0.036, sh * 0.018); ctx.fill(); }
  ctx.restore();
  return { x, y, w, h };
}

// ---------- motion helpers ----------
const easeBack = k => { k = clamp(k); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
/** Word-by-word pop-in. hi: indices drawn in the accent colour. */
function kinetic(str, x, y, t, a, o = {}) {
  const size = o.size || 96, weight = o.weight || 600, family = o.family || "display";
  const words = str.split(" "), space = measure(" ", size, weight, family);
  const widths = words.map(w => measure(w, size, weight, family));
  const total = widths.reduce((p, w) => p + w, 0) + space * (words.length - 1);
  let cx = o.align === "left" ? x : x - total / 2;
  words.forEach((w, i) => {
    const k = prog(t, a + i * (o.stagger ?? 0.05), 0.24);
    if (k > 0) {
      const e = easeBack(k), s = 1 + 0.4 * (1 - easeOut(k)), wx = cx + widths[i] / 2;
      ctx.save(); ctx.globalAlpha *= easeOut(k * 1.6);
      ctx.translate(wx, y); ctx.scale(s, s); ctx.translate(-wx, -y);
      txt(w, cx, y + (1 - e) * 36, { size, weight, family, ls: o.ls ?? -1, color: (o.hi || []).includes(i) ? (o.hiColor || C.redD) : (o.color || C.cream) });
      ctx.restore();
    }
    cx += widths[i] + space;
  });
}
function kicker(s, x, y, t, a, dark = true, align = "left") {
  const k = easeOut(prog(t, a, 0.2));
  txt(s, x + (1 - k) * -20, y, { size: 22, weight: 700, color: dark ? C.redD : C.red, ls: 4, alpha: k, align });
}
function drift(t, a) { return (t - a) * 18; }

// ---------- scenes (one per bar of the music, hard cuts on the downbeat) ----------
function sHook(t, a) {
  background(true, t);
  glowDot(W / 2, 700, 900, "#6A3A20", 0.4);
  const k = easeOut(prog(t, 0, 0.35));
  const live = liveRoute(t, D.profiles.balanced.route);
  // trail of the notes just played, fading
  const i = Math.max(0, live.i), trail = [];
  for (let j = Math.max(0, i - 6); j < i; j++) trail.push({ ...D.profiles.balanced.route[j], alpha: 0.12 + 0.06 * (j - i + 6) });
  const z = 1.08 - 0.08 * easeOut(prog(t, 0, 1.8));
  ctx.save(); ctx.translate(W / 2, 700); ctx.scale(z, z); ctx.translate(-W / 2, -700);
  drawFretboard({ x: 160, y: 560, w: 1600, h: 300, frets: 12, alpha: k, markers: live.markers, route: live.route, trail });
  ctx.restore();
  kinetic("Know exactly where", W / 2, 250, t, 0.15, { size: 104 });
  kinetic("every note goes.", W / 2, 380, t, 0.45, { size: 104, hi: [1] });
}
function sBrand(t, a) {
  background(true, t);
  glowDot(W / 2, 460, 800, "#7A3A1C", 0.45);
  const k = prog(t, a, 0.3), s = 0.6 + 0.4 * easeBack(k);
  const iconS = 230;
  ctx.save(); ctx.globalAlpha = easeOut(k * 2);
  ctx.translate(W / 2, 330); ctx.scale(s, s); ctx.rotate((1 - easeOut(k)) * -0.25); ctx.translate(-W / 2, -330);
  ctx.shadowColor = "rgba(224,118,92,0.6)"; ctx.shadowBlur = 90;
  rrect(W / 2 - iconS / 2, 330 - iconS / 2, iconS, iconS, iconS * 0.225); ctx.clip();
  ctx.drawImage(IMG.icon, W / 2 - iconS / 2, 330 - iconS / 2, iconS, iconS);
  ctx.restore();
  kinetic("StringMap", W / 2, 640, t, a + 0.12, { size: 170, weight: 700, ls: -3 });
  const k2 = easeOut(prog(t, a + 0.5, 0.3));
  txt("Learn notes. Find your frets.", W / 2, 745 + (1 - k2) * 20, { size: 46, weight: 500, color: C.onPlate, align: "center", alpha: k2 });
